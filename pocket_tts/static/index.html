<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pocket TTS</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #f0f2f5;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 800px;
                width: 100%;
                background: white;
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            }

            .view {
                display: none;
            }

            .view.active {
                display: block;
            }

            h1,
            h2 {
                margin-bottom: 1rem;
            }

            .auth-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
            }

            .auth-grid form {
                display: flex;
                flex-direction: column;
            }

            label {
                margin-top: 0.5rem;
                font-weight: 500;
            }

            input {
                padding: 0.6rem;
                margin-top: 0.25rem;
                border: 1px solid #ccc;
                border-radius: 6px;
            }

            .btn {
                background: #635bff;
                color: white;
                border: none;
                padding: 0.7rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 1rem;
            }

            .btn:hover {
                background: #4f47d6;
            }

            .btn-outline {
                background: transparent;
                border: 1px solid #635bff;
                color: #635bff;
            }

            .error {
                color: #b91c1c;
                background: #fee2e2;
                padding: 0.5rem;
                border-radius: 6px;
                margin-top: 0.5rem;
            }

            .plan-toggle {
                display: flex;
                justify-content: center;
                gap: 1rem;
                margin: 1.5rem 0;
            }

            .plan-toggle label {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                cursor: pointer;
            }

            .plan-cards {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
                margin: 1.5rem 0;
            }

            .plan-card {
                border: 2px solid #e5e7eb;
                border-radius: 10px;
                padding: 1.5rem;
                text-align: center;
                cursor: pointer;
                transition: 0.2s;
            }

            .plan-card.selected {
                border-color: #635bff;
                background: #f5f3ff;
            }

            .plan-card h3 {
                margin-bottom: 0.5rem;
            }

            .plan-card .price {
                font-size: 1.5rem;
                font-weight: 600;
            }

            .plan-card small {
                display: block;
                color: #6b7280;
            }

            .next-btn {
                width: 100%;
            }

            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 1rem;
                border-bottom: 1px solid #e5e7eb;
                margin-bottom: 1.5rem;
            }

            .user-info {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .gear {
                font-size: 1.5rem;
                cursor: pointer;
            }

            .badge {
                background: #e5e7eb;
                padding: 0.2rem 0.8rem;
                border-radius: 20px;
                font-size: 0.8rem;
            }

            #tts-ui textarea {
                width: 100%;
                padding: 0.75rem;
                border: 1px solid #ccc;
                border-radius: 6px;
                margin-bottom: 1rem;
                resize: vertical;
            }

            #audio-section {
                margin-top: 1.5rem;
            }

            #audio-section audio {
                width: 100%;
            }

            .hidden {
                display: none;
            }

            @media (max-width: 640px) {
                .auth-grid {
                    grid-template-columns: 1fr;
                    gap: 1.5rem;
                }

                .plan-cards {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div class="container" id="app">
            <!-- VIEW: Auth -->
            <div id="auth-view" class="view active">
                <h1>🎙️ Pocket TTS</h1>
                <p>Sign up or log in to start generating speech.</p>
                <div class="auth-grid">
                    <div>
                        <h3>Register</h3>
                        <form id="register-form">
                            <label>Email</label>
                            <input type="email" id="reg-email" required>
                            <label>Password</label>
                            <input type="password" id="reg-password" required>
                            <label>Name (optional)</label>
                            <input type="text" id="reg-name">
                            <button type="submit" class="btn">Register</button>
                            <div id="reg-error" class="error hidden"></div>
                        </form>
                    </div>
                    <div>
                        <h3>Login</h3>
                        <form id="login-form">
                            <label>Email</label>
                            <input type="email" id="login-email" required>
                            <label>Password</label>
                            <input type="password" id="login-password" required>
                            <button type="submit" class="btn">Login</button>
                            <div id="login-error" class="error hidden"></div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- VIEW: Plan Selection -->
            <div id="plan-view" class="view">
                <h2>Choose Your Plan</h2>
                <div class="plan-toggle">
                    <label><input type="radio" name="interval" value="monthly" checked> Monthly</label>
                    <label><input type="radio" name="interval" value="yearly"> Yearly</label>
                </div>
                <div id="plan-cards" class="plan-cards"></div>
                <button id="next-btn" class="btn next-btn">Next →</button>
                <div id="plan-error" class="error hidden"></div>
            </div>

            <!-- VIEW: App (TTS) -->
            <div id="app-view" class="view">
                <div class="navbar">
                    <div><strong>Pocket TTS</strong></div>
                    <div class="user-info">
                        <span id="user-email" class="badge"></span>
                        <span id="plan-badge" class="badge">Plan: Basic</span>
                        <span id="remaining-badge" class="badge">Remaining: 0</span>
                        <span class="gear" id="settings-gear" title="Manage billing">⚙️</span>
                    </div>
                </div>
                <div id="tts-ui">
                    <textarea id="text-input" rows="4">Hello world! I am Kyutai Pocket TTS.</textarea>
                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
                        <input type="text" id="voice-url" placeholder="Optional: voice URL or name (e.g. alba)"
                            style="flex:1;">
                        <input type="file" id="voice-file" accept=".wav,.mp3" style="flex:1;">
                    </div>
                    <button id="generate-btn" class="btn">Generate Audio</button>
                    <div id="status" class="hidden"></div>
                    <div id="audio-section" class="hidden">
                        <h3>Generated Audio</h3>
                        <audio id="audio" controls></audio>
                        <a id="download-link" class="btn btn-outline"
                            style="display:inline-block;margin-top:0.5rem;">Download</a>
                    </div>
                    <button id="logout-btn" class="btn btn-outline" style="margin-top:1.5rem;">Logout</button>
                </div>
            </div>
        </div>

        <script>
            // ---------- GLOBALS ----------
            const API_BASE = window.location.origin;
            let apiKey = localStorage.getItem('pocket_tts_api_key');
            let selectedPlan = null;    // 'basic', 'pro', 'enterprise'
            let selectedInterval = 'monthly';

            // DOM refs
            const authView = document.getElementById('auth-view');
            const planView = document.getElementById('plan-view');
            const appView = document.getElementById('app-view');
            const registerForm = document.getElementById('register-form');
            const loginForm = document.getElementById('login-form');
            const regError = document.getElementById('reg-error');
            const loginError = document.getElementById('login-error');
            const planCards = document.getElementById('plan-cards');
            const nextBtn = document.getElementById('next-btn');
            const planError = document.getElementById('plan-error');
            const intervalRadios = document.querySelectorAll('input[name="interval"]');
            const userEmailSpan = document.getElementById('user-email');
            const planBadge = document.getElementById('plan-badge');
            const remainingBadge = document.getElementById('remaining-badge');
            const settingsGear = document.getElementById('settings-gear');
            const textInput = document.getElementById('text-input');
            const voiceUrl = document.getElementById('voice-url');
            const voiceFile = document.getElementById('voice-file');
            const generateBtn = document.getElementById('generate-btn');
            const statusDiv = document.getElementById('status');
            const audioSection = document.getElementById('audio-section');
            const audioEl = document.getElementById('audio');
            const downloadLink = document.getElementById('download-link');
            const logoutBtn = document.getElementById('logout-btn');

            // ---------- HELPERS ----------
            function showView(viewId) {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            }

            function showError(el, msg) {
                el.textContent = msg;
                el.classList.remove('hidden');
            }
            function hideError(el) { el.classList.add('hidden'); }
            function showStatus(msg, isError = false) {
                statusDiv.textContent = msg;
                statusDiv.className = isError ? 'error' : 'success';
                statusDiv.classList.remove('hidden');
            }
            function hideStatus() { statusDiv.classList.add('hidden'); }

            async function apiFetch(path, options = {}) {
                const headers = { 'Content-Type': 'application/json' };
                if (apiKey) headers['X-API-Key'] = apiKey;
                const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
                if (!res.ok) {
                    let detail = 'Request failed';
                    try { const err = await res.json(); detail = err.detail || err.message; } catch (_) { }
                    throw new Error(detail);
                }
                return res.json();
            }

            // ---------- AUTH ----------
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError(regError);
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;
                const name = document.getElementById('reg-name').value.trim();
                try {
                    const data = await apiFetch('/stripe/register', {
                        method: 'POST',
                        body: JSON.stringify({ email, password, name })
                    });
                    apiKey = data.api_key;
                    localStorage.setItem('pocket_tts_api_key', apiKey);
                    afterAuth();
                } catch (err) {
                    showError(regError, err.message);
                }
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError(loginError);
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                try {
                    const data = await apiFetch('/stripe/login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });
                    apiKey = data.api_key;
                    localStorage.setItem('pocket_tts_api_key', apiKey);
                    afterAuth();
                } catch (err) {
                    showError(loginError, err.message);
                }
            });

            // ---------- AFTER AUTH: check subscription and show plan or app ----------
            async function afterAuth() {
                try {
                    const sub = await apiFetch('/stripe/subscription');
                    // If user has an active subscription, show the app
                    // (even if they've used all characters - they can renew or upgrade)
                    if (sub.status === 'active') {
                        showApp(sub);
                    } else {
                        // No active subscription - show plan selection
                        showPlanSelection();
                    }
                } catch (err) {
                    // If error (e.g., no subscription), show plan selection
                    showPlanSelection();
                }
            }

            // ---------- PLAN SELECTION ----------
            function showPlanSelection() {
                showView('plan-view');
                renderPlans();
                // set default interval
                selectedInterval = 'monthly';
                document.querySelector('input[name="interval"][value="monthly"]').checked = true;
                updatePlanVisibility();
            }

            // Plan data (should match backend plans)
            const PLANS = [
                { tier: 'basic', name: 'Basic', monthly_price: 500, yearly_price: 4800, quota: 50000 },
                { tier: 'pro', name: 'Pro', monthly_price: 1500, yearly_price: 14400, quota: 250000 },
                { tier: 'enterprise', name: 'Enterprise', monthly_price: 5000, yearly_price: 48000, quota: 1500000 }
            ];

            function renderPlans() {
                planCards.innerHTML = '';
                PLANS.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'plan-card';
                    card.dataset.plan = p.tier;
                    card.dataset.interval = 'monthly'; // will be toggled
                    card.innerHTML = `
                <h3>${p.name}</h3>
                <div class="price">$${(p.monthly_price / 100).toFixed(2)}</div>
                <small>per month</small>
                <div style="margin-top:0.5rem;">${(p.quota / 1000).toFixed(0)}k chars</div>
            `;
                    card.addEventListener('click', () => selectPlan(card));
                    planCards.appendChild(card);
                });
                // Update for yearly display
                updatePlanVisibility();
            }

            function selectPlan(card) {
                document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedPlan = card.dataset.plan;
                // The interval is determined by the toggle, but we also store it on card for later
            }

            function updatePlanVisibility() {
                const interval = document.querySelector('input[name="interval"]:checked').value;
                selectedInterval = interval;
                const cards = document.querySelectorAll('.plan-card');
                cards.forEach(card => {
                    const p = PLANS.find(p => p.tier === card.dataset.plan);
                    if (!p) return;
                    const price = (interval === 'monthly') ? p.monthly_price : p.yearly_price;
                    const period = (interval === 'monthly') ? 'month' : 'year';
                    card.dataset.interval = interval;
                    card.querySelector('.price').textContent = `$${(price / 100).toFixed(2)}`;
                    card.querySelector('small').textContent = `per ${period}`;
                    // Clear selection if any
                    card.classList.remove('selected');
                });
                selectedPlan = null;
            }

            intervalRadios.forEach(radio => {
                radio.addEventListener('change', updatePlanVisibility);
            });

            // Next button
            nextBtn.addEventListener('click', async () => {
                const selected = document.querySelector('.plan-card.selected');
                if (!selected) {
                    showError(planError, 'Please select a plan.');
                    return;
                }
                hideError(planError);
                const plan = selected.dataset.plan;
                const interval = selected.dataset.interval;
                try {
                    const data = await apiFetch(`/stripe/payment-link?plan=${plan}&interval=${interval}`);
                    window.location.href = data.url;
                } catch (err) {
                    showError(planError, err.message);
                }
            });

            // ---------- APP ----------
            function showApp(sub) {
                showView('app-view');
                userEmailSpan.textContent = sub.plan || 'User';
                planBadge.textContent = `Plan: ${sub.plan || 'None'}`;
                remainingBadge.textContent = `Remaining: ${sub.remaining_characters || 0}`;
                // Restore TTS UI logic (the same as before)
                // We'll reuse the same generate logic
            }

            // ---------- TTS GENERATION ----------
            generateBtn.addEventListener('click', async () => {
                const text = textInput.value.trim();
                if (!text) { showStatus('Please enter text.', true); return; }
                const formData = new FormData();
                formData.append('text', text);
                const voiceUrlVal = voiceUrl.value.trim();
                const voiceFileVal = voiceFile.files[0];
                if (voiceFileVal) formData.append('voice_wav', voiceFileVal);
                else if (voiceUrlVal) formData.append('voice_url', voiceUrlVal);

                generateBtn.disabled = true;
                generateBtn.textContent = 'Generating...';
                hideStatus();
                audioSection.classList.add('hidden');

                try {
                    const res = await fetch(`${API_BASE}/tts`, {
                        method: 'POST',
                        headers: { 'X-API-Key': apiKey },
                        body: formData,
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.detail || `Server error ${res.status}`);
                    }
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    audioEl.src = url;
                    downloadLink.href = url;
                    downloadLink.download = 'tts-output.wav';
                    audioSection.classList.remove('hidden');
                    showStatus('Audio generated!');
                    // update remaining
                    const sub = await apiFetch('/stripe/subscription');
                    remainingBadge.textContent = `Remaining: ${sub.remaining_characters || 0}`;
                } catch (err) {
                    showStatus(err.message, true);
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Audio';
                }
            });

            // ---------- SETTINGS / BILLING PORTAL ----------
            settingsGear.addEventListener('click', async () => {
                try {
                    const data = await apiFetch('/stripe/manage-billing');
                    window.open(data.portal_url, '_blank');
                } catch (err) {
                    alert('Could not open billing portal: ' + err.message);
                }
            });

            // ---------- LOGOUT ----------
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('pocket_tts_api_key');
                apiKey = null;
                showView('auth-view');
            });

            // ---------- INIT ----------
            if (apiKey) {
                afterAuth();
            } else {
                showView('auth-view');
            }

            // Also, after payment success (via /success redirect), we will land here; the check will show app.
            // We also listen for ?success param to force check.
            if (new URLSearchParams(window.location.search).has('success')) {
                if (apiKey) afterAuth();
            }
        </script>
    </body>

</html>
