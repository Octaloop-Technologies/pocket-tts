<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pocket TTS – Subscribe to Generate</title>
        <script src="https://js.stripe.com/v3/"></script>
        <style>
            /* --- Reset & base --- */
            * {
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #f8fafc;
                margin: 0;
                padding: 20px;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                max-width: 640px;
                width: 100%;
                background: white;
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            }

            .hidden {
                display: none !important;
            }

            h1,
            h2,
            h3 {
                font-weight: 600;
                margin-top: 0;
                letter-spacing: -0.02em;
            }

            label {
                display: block;
                font-weight: 500;
                margin-bottom: 0.25rem;
                font-size: 0.9rem;
            }

            input,
            select,
            .StripeElement {
                width: 100%;
                padding: 0.6rem 0.75rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 1rem;
                background: white;
                transition: border-color 0.15s;
                margin-bottom: 1rem;
            }

            input:focus,
            .StripeElement--focus {
                border-color: #635bff;
                outline: none;
                box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.15);
            }

            .btn {
                background: #635bff;
                color: white;
                border: none;
                border-radius: 8px;
                padding: 0.7rem 1.2rem;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.15s, opacity 0.15s;
                width: 100%;
                font-size: 1rem;
            }

            .btn:hover:not(:disabled) {
                background: #4f47d6;
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .btn-outline {
                background: transparent;
                color: #635bff;
                border: 1px solid #635bff;
            }

            .btn-outline:hover {
                background: #f0efff;
            }

            .error {
                color: #b91c1c;
                background: #fee2e2;
                padding: 0.6rem;
                border-radius: 6px;
                margin: 0.5rem 0;
            }

            .success {
                color: #065f46;
                background: #d1fae5;
                padding: 0.6rem;
                border-radius: 6px;
                margin: 0.5rem 0;
            }

            .price-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 1rem;
                margin: 1.5rem 0;
            }

            .price-card {
                border: 2px solid #e5e7eb;
                border-radius: 10px;
                padding: 1rem;
                text-align: center;
                cursor: default;
                transition: all 0.15s;
            }

            .price-card:hover {
                border-color: #635bff;
            }

            .price-card.selected {
                border-color: #635bff;
                background: #f5f3ff;
            }

            .price-card h3 {
                margin: 0 0 0.25rem;
            }

            .price-card .amount {
                font-size: 1.3rem;
                font-weight: 600;
            }

            #tts-ui textarea {
                width: 100%;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                padding: 0.75rem;
                font-family: inherit;
                font-size: 1rem;
                resize: vertical;
                margin-bottom: 1rem;
            }

            #audio-section {
                margin-top: 1.5rem;
            }

            #audio-section audio {
                width: 100%;
            }

            .spinner {
                display: inline-block;
                width: 1.2rem;
                height: 1.2rem;
                border: 2px solid #ccc;
                border-top-color: #635bff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                vertical-align: middle;
                margin-right: 0.5rem;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .flex-between {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .badge {
                background: #e5e7eb;
                padding: 0.2rem 0.8rem;
                border-radius: 20px;
                font-size: 0.8rem;
            }

            .mode-toggle {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }

            .mode-toggle button {
                flex: 1;
                padding: 0.5rem;
                border: 2px solid #d1d5db;
                border-radius: 8px;
                background: white;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.15s;
            }

            .mode-toggle button.active {
                border-color: #635bff;
                background: #f5f3ff;
                color: #635bff;
            }

            .mode-toggle button:hover:not(.active) {
                border-color: #a5a5a5;
            }

            .pricing-preview {
                margin: 1.5rem 0;
            }

            .pricing-preview .price-card {
                cursor: default;
            }
        </style>
    </head>

    <body>
        <div class="container" id="app">

            <!-- ===== REGISTRATION / LOGIN ===== -->
            <div id="register-section">
                <h1>🎙️ Pocket TTS</h1>
                <p>Sign in to start generating high‑quality speech.</p>

                <!-- Public pricing preview (shown before login) -->
                <div id="public-pricing" class="pricing-preview">
                    <h3>Choose your plan</h3>
                    <div id="public-price-grid" class="price-grid"></div>
                    <p style="font-size:0.9rem; color:#4b5563;">Plans are shown for reference. Sign up to subscribe.</p>
                    <hr style="margin:1.5rem 0;">
                </div>

                <div class="mode-toggle">
                    <button id="mode-register" class="active">Register</button>
                    <button id="mode-login">Login</button>
                </div>

                <form id="auth-form">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="you@example.com" required>
                    <label for="auth-name">Name (optional – only for registration)</label>
                    <input type="text" id="auth-name" placeholder="Your name">
                    <button type="submit" class="btn" id="auth-btn">Register</button>
                </form>
                <div id="auth-error" class="error hidden"></div>
            </div>

            <!-- ===== PLAN SELECTION & PAYMENT (after login) ===== -->
            <div id="subscription-section" class="hidden">
                <div class="flex-between">
                    <h2>Choose your plan</h2>
                    <span id="user-email" class="badge"></span>
                </div>
                <div id="price-grid" class="price-grid"></div>
                <div id="payment-form-container" class="hidden">
                    <hr style="margin: 1.5rem 0;">
                    <p>Enter your card details to start your subscription.</p>
                    <form id="payment-form">
                        <div id="card-element" style="margin-bottom: 1rem;"></div>
                        <button type="submit" class="btn" id="pay-btn">Subscribe now</button>
                        <div id="payment-error" class="error hidden"></div>
                    </form>
                </div>
                <div id="subscription-status" class="success hidden"></div>
                <button id="logout-btn" class="btn btn-outline" style="margin-top:1rem;">Logout</button>
            </div>

            <!-- ===== TTS GENERATION ===== -->
            <div id="tts-ui" class="hidden">
                <div class="flex-between">
                    <h2>🎤 Generate Speech</h2>
                    <span id="remaining-characters" class="badge"></span>
                </div>
                <textarea id="text-input" rows="4"
                    placeholder="Enter text to speak...">Hello world! I am Kyutai Pocket TTS.</textarea>

                <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
                    <input type="text" id="voice-url-input" placeholder="Optional: voice URL or name (e.g. alba)"
                        style="flex:1; min-width:150px; margin:0;">
                    <input type="file" id="voice-wav-input" accept=".wav,.mp3,.flac,.ogg,.m4a"
                        style="flex:1; min-width:150px; margin:0;">
                </div>

                <button id="generate-btn" class="btn">Generate Audio</button>
                <div id="status" class="hidden"></div>
                <div id="audio-section" class="hidden">
                    <h3>Generated Audio</h3>
                    <audio id="audio" controls class="w-full"></audio>
                    <a id="download-link" class="btn btn-outline"
                        style="display:inline-block;width:auto;margin-top:0.5rem;">Download</a>
                </div>
                <button id="logout-btn-tts" class="btn btn-outline" style="margin-top:1.5rem;">Logout</button>
            </div>
        </div>

        <script>
            // ---------------------------------------------------------------------
            //  State
            // ---------------------------------------------------------------------
            const API_BASE = window.location.origin;
            let API_KEY = localStorage.getItem('pocket_tts_api_key');
            let STRIPE = null;
            let cardElement = null;
            let selectedPriceId = null;
            let currentSubscription = null;

            // DOM refs
            const registerSection = document.getElementById('register-section');
            const subscriptionSection = document.getElementById('subscription-section');
            const ttsUI = document.getElementById('tts-ui');

            const authForm = document.getElementById('auth-form');
            const authEmail = document.getElementById('auth-email');
            const authName = document.getElementById('auth-name');
            const authBtn = document.getElementById('auth-btn');
            const authError = document.getElementById('auth-error');

            const modeRegister = document.getElementById('mode-register');
            const modeLogin = document.getElementById('mode-login');
            let isRegisterMode = true;

            const userEmailSpan = document.getElementById('user-email');
            const priceGrid = document.getElementById('price-grid');
            const paymentFormContainer = document.getElementById('payment-form-container');
            const paymentForm = document.getElementById('payment-form');
            const cardElementContainer = document.getElementById('card-element');
            const payBtn = document.getElementById('pay-btn');
            const paymentError = document.getElementById('payment-error');
            const subscriptionStatus = document.getElementById('subscription-status');
            const logoutBtns = document.querySelectorAll('#logout-btn, #logout-btn-tts');
            const textInput = document.getElementById('text-input');
            const voiceUrlInput = document.getElementById('voice-url-input');
            const voiceWavInput = document.getElementById('voice-wav-input');
            const generateBtn = document.getElementById('generate-btn');
            const statusDiv = document.getElementById('status');
            const audioSection = document.getElementById('audio-section');
            const audioEl = document.getElementById('audio');
            const downloadLink = document.getElementById('download-link');
            const remainingSpan = document.getElementById('remaining-characters');

            // Public pricing
            const publicPriceGrid = document.getElementById('public-price-grid');

            // ---------------------------------------------------------------------
            //  Load public pricing (shown before login)
            // ---------------------------------------------------------------------
            async function loadPublicPrices() {
                try {
                    const response = await fetch(`${API_BASE}/stripe/config`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const config = await response.json();
                    const prices = config.prices || [];
                    if (prices.length === 0) {
                        publicPriceGrid.innerHTML = '<p>No plans available. Please contact support.</p>';
                        return;
                    }
                    publicPriceGrid.innerHTML = '';
                    prices.forEach(price => {
                        const div = document.createElement('div');
                        div.className = 'price-card';
                        div.innerHTML = `
                <h3>${price.name || 'Plan'}</h3>
                <div class="amount">$${(price.amount || 0) / 100}</div>
                <small>/${price.recurring?.interval || 'month'}</small>
            `;
                        publicPriceGrid.appendChild(div);
                    });
                } catch (err) {
                    publicPriceGrid.innerHTML = `<p>Error loading plans: ${err.message}</p>`;
                }
            }

            // Load public pricing immediately
            loadPublicPrices();

            // ---------------------------------------------------------------------
            //  Mode toggle
            // ---------------------------------------------------------------------
            modeRegister.addEventListener('click', () => {
                isRegisterMode = true;
                modeRegister.classList.add('active');
                modeLogin.classList.remove('active');
                authBtn.textContent = 'Register';
                authName.disabled = false;
                authName.closest('label').style.display = 'block';
            });
            modeLogin.addEventListener('click', () => {
                isRegisterMode = false;
                modeLogin.classList.add('active');
                modeRegister.classList.remove('active');
                authBtn.textContent = 'Login';
                authName.disabled = true;
                authName.closest('label').style.display = 'none';
            });

            // ---------------------------------------------------------------------
            //  Helpers
            // ---------------------------------------------------------------------
            function showError(el, msg) {
                el.textContent = msg;
                el.classList.remove('hidden');
            }
            function hideError(el) {
                el.classList.add('hidden');
            }
            function setLoading(btn, loading) {
                btn.disabled = loading;
                btn.textContent = loading ? 'Processing...' : btn.dataset.originalText || btn.textContent;
            }
            function showStatus(msg, isError = false) {
                statusDiv.textContent = msg;
                statusDiv.className = isError ? 'error' : 'success';
                statusDiv.classList.remove('hidden');
            }
            function hideStatus() { statusDiv.classList.add('hidden'); }

            // Fetch without API key (for register/login)
            async function authFetch(path, body) {
                const res = await fetch(`${API_BASE}${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!res.ok) {
                    let detail = 'Request failed';
                    try {
                        const err = await res.json();
                        detail = err.detail || err.message || JSON.stringify(err);
                    } catch (_) {
                        detail = res.statusText || `HTTP ${res.status}`;
                    }
                    throw new Error(detail);
                }
                return res.json();
            }

            // Fetch with API key
            async function apiFetch(path, options = {}) {
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                if (API_KEY) headers['X-API-Key'] = API_KEY;
                const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
                if (!res.ok) {
                    let detail = 'Request failed';
                    try {
                        const err = await res.json();
                        detail = err.detail || err.message || JSON.stringify(err);
                    } catch (_) {
                        detail = res.statusText || `HTTP ${res.status}`;
                    }
                    throw new Error(detail);
                }
                return res.json();
            }

            // ---------------------------------------------------------------------
            //  Authentication (Register / Login)
            // ---------------------------------------------------------------------
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError(authError);
                setLoading(authBtn, true);

                const email = authEmail.value.trim();
                const name = authName.value.trim();

                try {
                    let data;
                    if (isRegisterMode) {
                        data = await authFetch('/stripe/register', { email, name });
                    } else {
                        data = await authFetch('/stripe/login', { email });
                    }
                    API_KEY = data.api_key;
                    localStorage.setItem('pocket_tts_api_key', API_KEY);
                    // Proceed to check subscription
                    await checkSubscriptionAndShowUI();
                } catch (err) {
                    showError(authError, err.message);
                } finally {
                    setLoading(authBtn, false);
                }
            });

            // ---------------------------------------------------------------------
            //  Check subscription & render correct UI
            // ---------------------------------------------------------------------
            async function checkSubscriptionAndShowUI() {
                if (!API_KEY) {
                    registerSection.classList.remove('hidden');
                    subscriptionSection.classList.add('hidden');
                    ttsUI.classList.add('hidden');
                    document.getElementById('public-pricing').classList.remove('hidden');
                    return;
                }

                try {
                    const sub = await apiFetch('/stripe/subscription');
                    currentSubscription = sub;

                    if (sub.status === 'active' && sub.remaining_characters > 0) {
                        // Show TTS UI
                        registerSection.classList.add('hidden');
                        subscriptionSection.classList.add('hidden');
                        ttsUI.classList.remove('hidden');
                        updateRemaining(sub.remaining_characters);
                        return;
                    }

                    // Not active or no quota → show subscription flow
                    registerSection.classList.add('hidden');
                    subscriptionSection.classList.remove('hidden');
                    ttsUI.classList.add('hidden');
                    document.getElementById('public-pricing').classList.add('hidden');

                    const user = await apiFetch('/stripe/user');
                    userEmailSpan.textContent = user.email || '';

                    await loadPrices();

                    if (sub.status && sub.status !== 'none') {
                        subscriptionStatus.textContent = `Your ${sub.plan || 'plan'} is ${sub.status}. Please choose a plan to continue.`;
                        subscriptionStatus.classList.remove('hidden');
                    } else {
                        subscriptionStatus.classList.add('hidden');
                    }

                    initStripe();

                } catch (err) {
                    if (err.message.includes('401') || err.message.includes('Invalid API key')) {
                        localStorage.removeItem('pocket_tts_api_key');
                        API_KEY = null;
                        registerSection.classList.remove('hidden');
                        subscriptionSection.classList.add('hidden');
                        ttsUI.classList.add('hidden');
                        document.getElementById('public-pricing').classList.remove('hidden');
                    } else {
                        alert('Error: ' + err.message);
                    }
                }
            }

            // ---------------------------------------------------------------------
            //  Load prices (after login – interactive)
            // ---------------------------------------------------------------------
            async function loadPrices() {
                const config = await fetch(`${API_BASE}/stripe/config`).then(r => r.json());
                const prices = config.prices || [];
                if (!prices.length) {
                    priceGrid.innerHTML = '<p>No plans available. Contact support.</p>';
                    return;
                }

                priceGrid.innerHTML = '';
                prices.forEach(price => {
                    const div = document.createElement('div');
                    div.className = 'price-card';
                    div.dataset.priceId = price.id;
                    div.innerHTML = `
            <h3>${price.name || 'Plan'}</h3>
            <div class="amount">$${(price.amount || 0) / 100}</div>
            <small>/${price.recurring?.interval || 'month'}</small>
        `;
                    div.addEventListener('click', () => selectPrice(price.id));
                    priceGrid.appendChild(div);
                });

                if (prices.length) selectPrice(prices[0].id);
            }

            function selectPrice(priceId) {
                selectedPriceId = priceId;
                document.querySelectorAll('.price-card').forEach(el => {
                    el.classList.toggle('selected', el.dataset.priceId === priceId);
                });
                paymentFormContainer.classList.remove('hidden');
            }

            // ---------------------------------------------------------------------
            //  Stripe Elements
            // ---------------------------------------------------------------------
            async function initStripe() {
                if (STRIPE) return;
                const config = await fetch(`${API_BASE}/stripe/config`).then(r => r.json());
                STRIPE = Stripe(config.publishableKey);

                const elements = STRIPE.elements();
                cardElement = elements.create('card', {
                    style: { base: { fontSize: '16px', color: '#1a1a1a' } }
                });
                cardElement.mount('#card-element');
            }

            // ---------------------------------------------------------------------
            //  Payment form
            // ---------------------------------------------------------------------
            paymentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError(paymentError);
                setLoading(payBtn, true);

                if (!selectedPriceId) {
                    showError(paymentError, 'Please select a plan first.');
                    setLoading(payBtn, false);
                    return;
                }

                try {
                    // Create subscription – send price_id in JSON body
                    const { subscriptionId, clientSecret } = await apiFetch('/stripe/create-subscription', {
                        method: 'POST',
                        body: JSON.stringify({ price_id: selectedPriceId }),
                    });

                    // Confirm payment with Stripe Elements
                    const { error } = await STRIPE.confirmCardPayment(clientSecret, {
                        payment_method: { card: cardElement },
                    });

                    if (error) {
                        showError(paymentError, error.message);
                        setLoading(payBtn, false);
                        return;
                    }

                    // Success – refresh subscription status
                    paymentError.classList.add('hidden');
                    subscriptionStatus.textContent = '🎉 Subscription active! Redirecting to TTS...';
                    subscriptionStatus.classList.remove('hidden');

                    setTimeout(async () => {
                        await checkSubscriptionAndShowUI();
                    }, 1500);

                } catch (err) {
                    showError(paymentError, err.message);
                    setLoading(payBtn, false);
                }
            });

            // ---------------------------------------------------------------------
            //  TTS Generation
            // ---------------------------------------------------------------------
            generateBtn.addEventListener('click', async () => {
                const text = textInput.value.trim();
                if (!text) { showStatus('Please enter text.', true); return; }

                const formData = new FormData();
                formData.append('text', text);

                const voiceUrl = voiceUrlInput.value.trim();
                const voiceWav = voiceWavInput.files[0];

                if (voiceWav) {
                    formData.append('voice_wav', voiceWav);
                } else if (voiceUrl) {
                    formData.append('voice_url', voiceUrl);
                }

                generateBtn.disabled = true;
                generateBtn.textContent = 'Generating...';
                hideStatus();
                audioSection.classList.add('hidden');

                try {
                    const response = await fetch(`${API_BASE}/tts`, {
                        method: 'POST',
                        headers: { 'X-API-Key': API_KEY },
                        body: formData,
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.detail || `Server error (${response.status})`);
                    }

                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    audioEl.src = url;
                    downloadLink.href = url;
                    downloadLink.download = 'tts-output.wav';
                    audioSection.classList.remove('hidden');
                    showStatus('Audio generated successfully!');

                    const sub = await apiFetch('/stripe/subscription');
                    updateRemaining(sub.remaining_characters);

                } catch (err) {
                    showStatus(err.message, true);
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Audio';
                }
            });

            // ---------------------------------------------------------------------
            //  Logout
            // ---------------------------------------------------------------------
            logoutBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    localStorage.removeItem('pocket_tts_api_key');
                    API_KEY = null;
                    registerSection.classList.remove('hidden');
                    subscriptionSection.classList.add('hidden');
                    ttsUI.classList.add('hidden');
                    document.getElementById('public-pricing').classList.remove('hidden');
                    authEmail.value = '';
                    authName.value = '';
                    // Reset to register mode
                    isRegisterMode = true;
                    modeRegister.classList.add('active');
                    modeLogin.classList.remove('active');
                    authBtn.textContent = 'Register';
                    authName.disabled = false;
                    authName.closest('label').style.display = 'block';
                });
            });

            // ---------------------------------------------------------------------
            //  Update remaining characters
            // ---------------------------------------------------------------------
            function updateRemaining(remaining) {
                remainingSpan.textContent = `Remaining: ${remaining || 0} chars`;
            }

            // ---------------------------------------------------------------------
            //  Init
            // ---------------------------------------------------------------------
            checkSubscriptionAndShowUI();
        </script>
    </body>

</html>
